<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7ed">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Bun of the month – en separat vy i Bunzys tidiga webbkoncept.">
  <title>Bun of the month · Bunzy</title>
  <link rel="stylesheet" href="assets/fonts.css">
  <link rel="stylesheet" href="styles.css">
  <script src="order-demo.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="brand"><a href="index.html" aria-label="Bunzy, startsida"><img src="assets/bunzy-logo.jpg" alt="Bunzy" width="918" height="174" decoding="async"></a></div>
    <nav aria-label="Navigation">
      <a href="meny.html">Meny <span aria-hidden="true">→</span></a>
      <a href="index.html#hitta">Hitta hit <span aria-hidden="true">↓</span></a>
      <button type="button" class="order-button" data-order-open aria-haspopup="dialog" aria-controls="order-demo">Beställ online <span class="demo-label">Demo</span></button>
    </nav>
  </header>
  <main class="month-page">
    <a class="text-link back-link" href="index.html"><span aria-hidden="true">←</span> Tillbaka</a>
    <section class="month-layout" aria-labelledby="month-title">
      <div class="month-copy">
        <h1 id="month-title">Bun of<br>the month</h1>
        <p>Månadens smak kommer här.</p>
      </div>
      <figure class="month-photo">
        <picture><source type="image/webp" srcset="assets/photos/biscoff-360.webp 360w, assets/photos/biscoff-720.webp 720w" sizes="(max-width:700px) 260px, 320px"><img src="assets/photos/biscoff.jpg" alt="Biscoff Bun som exempelbild från Bunzys ordinarie sortiment, inte verifierad månadssmak" width="1200" height="675" decoding="async"></picture>
        <figcaption>Exempelbild: Biscoff Bun från ordinarie sortiment.</figcaption>
      </figure>
    </section>
  </main>
  <dialog id="order-demo" class="order-dialog" aria-labelledby="order-title" aria-describedby="order-description">
    <div class="dialog-heading"><h2 id="order-title">Beställ online</h2><button type="button" class="close-dialog" data-order-close aria-label="Stäng beställningsdemo">Stäng <span aria-hidden="true">×</span></button></div>
    <p id="order-description">Välj en bulle och antal.</p>
    <form id="order-form" method="dialog">
      <label for="order-bun">Bulle</label>
      <select id="order-bun" name="bun" autofocus><option>Classic Bun</option><option>Biscoff Bun</option><option>Pepperoni &amp; Hot Honey</option></select>
      <label for="order-quantity">Antal</label>
      <select id="order-quantity" name="quantity"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
      <button type="submit" class="primary-link">Visa mitt val <span aria-hidden="true">→</span></button>
    </form>
    <div id="order-result" class="order-result" hidden tabindex="-1" role="status">
      <strong>Ditt val</strong><p id="order-summary"></p>

    </div>
    <p class="order-note">Demo – inget skickas eller betalas.</p>
  </dialog>
</body>
</html>
